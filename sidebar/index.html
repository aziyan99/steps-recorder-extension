<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Test helper</title>
    <link
      rel="stylesheet"
      href="./styles.css"
      media="screen"
    />
    <link
      rel="stylesheet"
      href="../public/hint.min.css"
      media="screen"
    />
  </head>
  <body class="py-4 px-5 bg-neutral-100">
    <div
      class="flex flex-col w-full justify-start gap-y-4"
      style="height: calc(100vh - 50px)"
    >
      <div
        class="hidden flex-col flex-grow flex-shrink-0 gap-y-3"
        data-region="steps"
      ></div>
      <div class="flex flex-col">
        <button
          type="button"
          class="font-medium bg-neutral-800 text-center py-2 rounded-lg text-white text-lg block"
          data-action="start-capture"
        >
          Start capture
        </button>
        <button
          type="button"
          class="font-medium bg-neutral-800 text-center py-2 rounded-lg text-white text-lg hidden mb-3"
          data-action="stop-capture"
        >
          Stop capture
        </button>
      </div>
    </div>
    <script src="./scripts.js"></script>
  </body>
</html>
