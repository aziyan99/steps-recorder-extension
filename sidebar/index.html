<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Test helper</title>
    <link
      rel="stylesheet"
      href="./styles.css"
      media="screen"
    />
    <link
      rel="stylesheet"
      href="../public/hint.min.css"
      media="screen"
    />
  </head>
  <body class="py-4 px-5 bg-neutral-100">
    <div
      class="flex flex-col w-full justify-start gap-y-4"
      style="height: calc(100vh - 50px)"
    >
      <div
        class="hidden flex-col flex-grow flex-shrink-0 gap-y-3 overflow-y-auto"
        data-region="steps"
        style="max-height: calc(100vh - 180px);"
      ></div>
      <div class="flex flex-col gap-y-2 mt-auto">
        <button
          type="button"
          class="font-medium bg-neutral-800 text-center py-2 rounded-lg text-white text-lg block transition-colors hover:bg-neutral-900"
          data-action="start-capture"
        >
          Start capture
        </button>
        <button
          type="button"
          class="font-medium bg-neutral-800 text-center py-2 rounded-lg text-white text-lg hidden mb-3 transition-colors hover:bg-neutral-900"
          data-action="stop-capture"
        >
          Stop capture
        </button>
        <button
          type="button"
          id="btn-sidebar-history"
          class="font-medium bg-white text-neutral-700 text-center py-2 rounded-lg text-base border border-neutral-300 hover:bg-neutral-50 transition-colors"
        >
          View History
        </button>
      </div>
    </div>

    <!-- Sidebar History Overlay Drawer -->
    <div id="sidebar-history-overlay" class="fixed inset-0 bg-neutral-100 z-50 hidden flex-col p-4">
        <div class="flex justify-between items-center border-b border-neutral-200 pb-3 mb-4">
            <h2 class="text-base font-bold text-neutral-800">Recording History</h2>
            <button id="btn-sidebar-close-history" class="text-neutral-500 hover:text-neutral-800 p-1 hover:bg-neutral-200 rounded-full transition-colors">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
                </svg>
            </button>
        </div>
        <div id="sidebar-history-list" class="flex-grow overflow-y-auto flex flex-col gap-3">
            <!-- Dynamic items populated in scripts.js -->
        </div>
    </div>

    <script src="./scripts.js"></script>
  </body>
</html>
