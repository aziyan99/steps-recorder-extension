<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editor - Steps Recorder</title>
</head>

<body class="bg-neutral-100 font-inter print:bg-white flex flex-col min-h-screen">
    <!-- Top Header Navigation -->
    <header class="bg-white border-b border-neutral-200 px-6 py-4 flex justify-between items-center print:hidden shadow-sm">
        <div class="flex items-center gap-3">
            <h1 id="editor-title" class="text-xl font-bold text-neutral-800 outline-none border-b border-dashed border-neutral-300 focus:border-neutral-800 px-1 py-0.5 rounded cursor-pointer" contenteditable="true" title="Click to rename guide">Recording Guide</h1>
        </div>
        <div class="flex items-center gap-2">
            <button id="btn-history" class="bg-white hover:bg-neutral-50 text-neutral-700 font-medium py-2 px-4 rounded border border-neutral-300 inline-flex items-center gap-2 transition-colors">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 6v6h4.5m4.5 0a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" />
                </svg>
                <span>History</span>
            </button>
        </div>
    </header>

    <section class="flex flex-col w-full flex-grow">
        <main class="flex flex-grow flex-shrink-0 w-full h-full">
            <section class="flex flex-col gap-y-4 w-full pt-6 h-full items-center pb-24" data-region="steps">
                <!-- Steps rendered here dynamically -->
            </section>
        </main>
    </section>

    <!-- Floating Toolbars -->
    <button id="btn-add-text" class="fixed bottom-6 right-44 z-40 bg-neutral-700 hover:bg-neutral-800 text-white font-bold py-2 px-4 rounded shadow-lg inline-flex items-center gap-2 transition-colors print:hidden">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
        </svg>
        <span>Add Text Step</span>
    </button>

    <button id="btn-print" class="fixed bottom-6 right-6 z-40 text-neutral-800 bg-neutral-100 border border-neutral-800 hover:bg-neutral-800 hover:text-white font-bold py-2 px-4 rounded shadow-lg inline-flex items-center gap-2 transition-colors print:hidden">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6.72 13.829c-.24.03-.48.062-.72.096m.72-.096a42.415 42.415 0 0 1 10.56 0m-10.56 0L6.34 18m10.94-4.171c.24.03.48.062.72.096m-.72-.096L17.66 18m0 0 .229 2.523a1.125 1.125 0 0 1-1.12 1.227H7.231c-.662 0-1.198-.535-1.198-1.227L6.34 18m11.318 0h1.091A2.25 2.25 0 0 0 21 15.75V9.456c0-1.081-.768-2.015-1.837-2.175a48.055 48.055 0 0 0-1.913-.247M6.34 18H5.25A2.25 2.25 0 0 1 3 15.75V9.456c0-1.081.768-2.015 1.837-2.175a48.041 48.041 0 0 1 1.913-.247m10.5 0a48.536 48.536 0 0 0-10.5 0m10.5 0V3.375c0-.621-.504-1.125-1.125-1.125h-8.25c-.621 0-1.125.504-1.125 1.125v3.659M18 10.5h.008v.008H18V10.5Zm-3 0h.008v.008H15V10.5Z" />
        </svg>
        <span>Export PDF</span>
    </button>

    <!-- History Drawer Overlay -->
    <div id="history-drawer" class="fixed inset-y-0 right-0 w-[450px] bg-white shadow-2xl z-50 transform translate-x-full transition-transform duration-300 ease-in-out border-l border-neutral-200 flex flex-col print:hidden">
        <div class="p-6 border-b border-neutral-200 flex justify-between items-center">
            <h2 class="text-lg font-bold text-neutral-800">Recording History</h2>
            <button id="btn-close-history" class="text-neutral-500 hover:text-neutral-800 p-1 rounded-full hover:bg-neutral-100 transition-colors">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-6 h-6">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
                </svg>
            </button>
        </div>
        <div id="history-list-container" class="flex-grow overflow-y-auto p-6 flex flex-col gap-4">
            <!-- Dynamic history list items go here -->
        </div>
    </div>
    <!-- History Drawer Backdrop -->
    <div id="history-backdrop" class="fixed inset-0 bg-black/30 backdrop-blur-sm z-30 hidden print:hidden"></div>

    <script src="./editor.js"></script>
</body>

</html>
